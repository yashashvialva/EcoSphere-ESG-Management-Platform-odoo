version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecosphere-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecosphere
      POSTGRES_PASSWORD: ecosphere_pass
      POSTGRES_DB: ecosphere
    ports:
      - '5433:5432'
    volumes:
      - ecosphere_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecosphere']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ecosphere_data:
