version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecosphere-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecosphere
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ecosphere_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecosphere"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ecosphere_pgdata:
    driver: local
